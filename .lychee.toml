# Link checker defaults for Markdown documentation.
# Blogger's homepage currently returns an automated Google 429 challenge to hosted CI.
# Exclude only that homepage URL; other documentation links remain checked.
max_concurrency = 8
timeout = 10
max_retries = 0
retry_wait_time = 1
exclude = [
  '^mailto:',
  '^tel:',
  '^https://digitalhealthplus\\.blogspot\\.com/?$',
]

[hosts."digitalhealthplus.blogspot.com"]
concurrency = 1
request_interval = 3
